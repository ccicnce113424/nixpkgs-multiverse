# Publishes the index browser to GitHub Pages: the site/ files plus the three
# data files the page fetches at runtime. The data is copied into the artifact
# rather than fetched from raw.githubusercontent.com so that versions.json and
# revisions.json always deploy atomically — the offsets in one are only valid
# against the other.
#
# update-index.yml commits hourly when the channel moves, so the site tracks
# the index at the same cadence.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - index/versions.json
      - revisions.json
      - releases.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys must land in order; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp revisions.json releases.json _site/
          cp index/versions.json _site/
          # Stamp the deploying commit into the footer — this names exactly
          # the tree the data files above were copied from.
          sed -i "s/__COMMIT__/${GITHUB_SHA}/" _site/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
