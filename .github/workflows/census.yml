# The weekly census: is every indexed store path still downloadable from
# cache.nixos.org? A GET of each narinfo and a HEAD of the NAR it points at —
# the cache remembering a path and the cache still serving its bytes are
# different claims, and the census re-earns both every week.
#
# ~600k distinct digests across the three published systems, at the 610/s
# measured below: under twenty minutes against this job's five-hour ceiling.
# Results publish to the rolling release (they are observations with a
# timestamp, stale by nature), and newly dead digests are appended to the crawl
# graph so the next hourly consolidation marks them dead in the pinned
# artifacts too.
name: census

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: census
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Only `nix hash path` is needed here (the state restore verifies every
      # pinned download), but the standard installer keeps the setup uniform
      # with the other workflows.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore the outpaths state
        run: bash tools/restore-outpaths-state.sh

      # Every system's artifacts, because the census is about digests and a
      # digest is a digest whichever system evaluated it — but an aarch64 path
      # dying is exactly as interesting as an x86_64 one, and only the seeds
      # decide which get looked at. The glob keeps that true without edits:
      # restore-outpaths-state.sh names the files from data-pins.json, so a
      # system joins the census by being published.
      #
      # 128 threads rather than the tool's 32. This is latency-bound work and
      # nothing throttles it: measured over disjoint cold samples, 32 threads
      # gave 177 digests/s, 64 gave 327, 96 gave 486 and 128 gave 610, with
      # zero retries at every level. The cost per digest is dominated by the
      # HEAD on its NAR — narinfos are edge-cached and answer in ~9 ms from a
      # runner, NAR objects are not — which is the shape concurrency fixes.
      #
      # It stops at 128 for politeness rather than capacity: the runner is idle
      # either way, but cache.nixos.org is a shared resource and the crawl in
      # the hourly job already asks it for 3,500 narinfos a second.
      - name: Take the census
        run: |
          python3 tools/census.py \
            --seeds index/.outpaths/data/prev/outpaths-*.json \
                    index/.outpaths/data/prev/tip-outpaths-*.json \
            --threads 128 \
            --out census-results.json \
            --graph index/.outpaths/graph.jsonl.gz \
            --date "$(date -u +%F)"

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload data-rolling --clobber \
            census-results.json \
            index/.outpaths/graph.jsonl.gz
