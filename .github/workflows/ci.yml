# Validates that the committed index and the multiverse API actually work,
# on every change: formatting first, then `nix flake check`, which runs the
# checks defined in flake.nix —
#
#   checks.index    — pure assertions over the committed JSON, no network
#   checks.flake-at — flakeAt's flake shape; fetches three trees at eval time
#   checks.compose  — the headline claim end to end: three Pythons from three
#                     revisions composed into one buildEnv, built for real
#                     (contents substitute from cache.nixos.org)
#
# update-index.yml keeps the index fresh; this workflow keeps it honest.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L
