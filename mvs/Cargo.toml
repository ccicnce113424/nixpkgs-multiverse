[package]
name = "mvs"
version = "0.1.0"
edition = "2021"
description = "Read the nixpkgs multiverse index: versions, lifetimes, revisions, pins"
license = "MIT"

[dependencies]
# `bundled` compiles SQLite from the vendored amalgamation. The database is a
# build product of this repository, so the version of SQLite that reads it
# should be pinned to the binary rather than to whatever the host happens to
# have.
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstream = "1"
owo-colors = "4"

[profile.release]
# The database is 8 MB and every query is one SQL statement; the binary spends
# its time in SQLite, not in codegen. Optimise for a small artifact.
opt-level = "s"
lto = true
strip = true
